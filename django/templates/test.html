<!DOCTYPE html>
<html>
<body>

<button onclick="startTask()">
开始测试
</button>

<div
style="
width:500px;
height:30px;
border:1px solid black;
">

<div
id="bar"
style="
width:0%;
height:100%;
background:green;
transition: width 0.2s;
">
</div>

</div>

<p id="text"></p>

<script>

function startTask(){

    fetch("/api/test-task/")
    .then(r => r.json())
    .then(data => {

        let taskId = data.task_id;

        const protocol =
            location.protocol === "https:"
            ? "wss"
            : "ws";

        // 🔥 必须和 routing.py 一致
        let socket = new WebSocket(
            `${protocol}://${location.host}/ws/task/${taskId}/`
        );

        socket.onopen = () => {
            console.log("WebSocket connected");
        };

        socket.onmessage = (e) => {

            let data = JSON.parse(e.data);

            console.log(data);

            // 🔥 这里是 percent，不是 progress
            document.getElementById(
                "bar"
            ).style.width =
                data.percent + "%";

            document.getElementById(
                "text"
            ).innerText =
                data.message;
        };

        socket.onerror = (e) => {
            console.error("WebSocket error", e);
        };

        socket.onclose = () => {
            console.log("WebSocket closed");
        };

    });

}

</script>

</body>
</html>
